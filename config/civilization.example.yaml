host: 0.0.0.0
port: 8000
database_path: data/civilization.db
log_level: INFO
decision_interval_seconds: 45
observation_radius: 32
max_concurrent_ai: 1
agent_count: 3
use_mock_world: true
civilization_name: "New Civilization"

initial_instruction: |
  You are an independent member of a new civilization in Minecraft.
  Your civilization begins with no established society.
  Your objective is to survive, cooperate, explore, develop resources, establish settlements,
  construct buildings, and create a functioning society.

ai:
  default_provider: ollama
  providers:
    ollama:
      enabled: true
      base_url: http://localhost:11434
      model: qwen3:8b
      timeout: 120
      max_concurrency: 1

agents:
  - agent_id: agent_01
    name: CHAIWALA
    personality: "Curious, ambitious, independent, strategic"
    interests: ["leadership", "exploration", "civilization planning", "social organization", "major construction"]
    provider: ollama
    model: ""
  - agent_id: agent_02
    name: Arin
    personality: "Intelligent, practical, patient, creative, organized"
    interests: ["construction", "engineering", "mining", "resource management", "infrastructure"]
    provider: ollama
    model: ""
  - agent_id: agent_03
    name: Mira
    personality: "Adventurous, curious, social, independent, adaptable"
    interests: ["exploration", "farming", "trading", "food production", "discovering new locations"]
    provider: ollama
    model: ""

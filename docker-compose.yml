version: "3.9"
services:
  ai-engine:
    build: ./ai-engine
    ports:
      - "8000:8000"
      - "8001:8001"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
    environment:
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=qwen3:8b
  dashboard:
    build: ./dashboard
    ports:
      - "5173:5173"
    depends_on:
      - ai-engine